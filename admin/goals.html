<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>30-Day Challenge · Member Goals</title>
<style>
  :root{
    --bg:#0e1116; --card:#171b22; --card2:#1e232c; --line:#2a313c;
    --ink:#e8ecf2; --dim:#9aa4b2; --accent:#4ade80; --warn:#f59e0b; --cold:#64748b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:22px 16px 80px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:14px;margin:0 0 18px}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:110px}
  .stat b{display:block;font-size:24px;line-height:1.1}
  .stat span{color:var(--dim);font-size:12px}
  .stat.green b{color:var(--accent)} .stat.warn b{color:var(--warn)} .stat.cold b{color:var(--cold)}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  input#q{flex:1;min-width:180px;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;user-select:none}
  .chip.on{background:var(--card2);color:var(--ink);border-color:#3b4552}
  .seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{background:none;border:0;color:var(--dim);padding:9px 14px;font-size:13px;cursor:pointer}
  .seg button.on{background:var(--card2);color:var(--ink)}
  .row{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
  .row .g{font-size:22px;line-height:1.2;width:30px;text-align:center;flex:0 0 auto}
  .row .body{flex:1;min-width:0}
  .row .name{font-weight:600}
  .row .garden{color:var(--dim);font-size:13px}
  .row .acts{margin-top:6px;font-size:13px;color:var(--ink)}
  .row .acts span{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:3px 8px;margin:3px 4px 0 0}
  .badge{flex:0 0 auto;font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;align-self:center}
  .badge.started{background:rgba(74,222,128,.15);color:var(--accent)}
  .badge.claimed{background:rgba(245,158,11,.15);color:var(--warn)}
  .badge.none{background:rgba(100,116,139,.15);color:var(--cold)}
  .muted{color:var(--dim)}
  .refresh{background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 14px;font-size:13px;cursor:pointer}
  .empty{color:var(--dim);text-align:center;padding:40px 0}
  a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <h1>🌱 30-Day Challenge · Member Goals</h1>
  <p class="sub">Live from the board. What each member chose to grow this month, and where they are. <a href="/games">open the board →</a></p>

  <div class="stats" id="stats"></div>

  <div class="controls">
    <input id="q" placeholder="Search a name…">
    <span class="seg" id="statusSeg">
      <button data-s="all" class="on">All</button>
      <button data-s="started">Started</button>
      <button data-s="claimed">Claimed, not logged</button>
      <button data-s="none">Not started</button>
    </span>
    <button class="refresh" id="refresh">↻ Refresh</button>
  </div>

  <div class="chips" id="gardenChips"></div>
  <div id="list"></div>
</div>

<script>
const GARDENS = {
  fit:['💪','Fitness'], art:['🎨','Creative'], content:['📱','Content'], biz:['💼','Business'],
  connect:['❤️','Connection'], meditate:['🧘','Meditation'], breath:['🌬️','Breathwork'],
  courage:['🦁','Courage'], relax:['😌','Relaxation'], nature:['🌳','Nature'],
  wins:['🏅','Wins of the Day'], any:['🃏','Wildcard'], relationship:['💞','Relationship']
};
let RAW=[], gardenFilter='', statusFilter='all', query='';

function statusOf(m){
  const days=m.days||{};
  const logged=Object.keys(days).some(k=>/^\d+$/.test(k));
  if(logged) return 'started';
  if(m.claimed) return 'claimed';
  return 'none';
}
function actionsOf(m){
  const plan=(m.days||{}).plan||{}; const out=[];
  for(const k in plan){ if(Array.isArray(plan[k])) for(const it of plan[k]){ if(it&&it.a) out.push(it.a.trim()); } }
  return [...new Set(out)];
}

async function load(){
  document.getElementById('list').innerHTML='<div class="empty">Loading…</div>';
  try{
    const r=await fetch('/api/games',{cache:'no-store'}); const d=await r.json();
    RAW=(d.members||[]).map(m=>({name:m.name, garden:(m.days||{}).main||'', status:statusOf(m), actions:actionsOf(m)}));
    render();
  }catch(e){ document.getElementById('list').innerHTML='<div class="empty">Could not load the board.</div>'; }
}

function render(){
  const started=RAW.filter(m=>m.status==='started').length;
  const claimed=RAW.filter(m=>m.status==='claimed').length;
  const none=RAW.filter(m=>m.status==='none').length;
  const withGoal=RAW.filter(m=>m.garden).length;
  document.getElementById('stats').innerHTML=
    stat('green',started,'Started (logged)')+
    stat('warn',claimed,'Claimed, not logged')+
    stat('cold',none,'Not started')+
    stat('',withGoal,'Picked a goal');

  // garden chips (counts)
  const counts={};
  RAW.forEach(m=>{ if(m.garden) counts[m.garden]=(counts[m.garden]||0)+1; });
  let chips='<span class="chip '+(!gardenFilter?'on':'')+'" data-g="">All gardens</span>';
  Object.keys(GARDENS).forEach(k=>{ if(counts[k]) chips+='<span class="chip '+(gardenFilter===k?'on':'')+'" data-g="'+k+'">'+GARDENS[k][0]+' '+GARDENS[k][1]+' ('+counts[k]+')</span>'; });
  document.getElementById('gardenChips').innerHTML=chips;

  let list=RAW.slice();
  if(gardenFilter) list=list.filter(m=>m.garden===gardenFilter);
  if(statusFilter!=='all') list=list.filter(m=>m.status===statusFilter);
  if(query) list=list.filter(m=>m.name.toLowerCase().includes(query));
  list.sort((a,b)=>a.name.localeCompare(b.name));

  const badge={started:['started','Started'],claimed:['claimed','Claimed'],none:['none','Not started']};
  const html=list.map(m=>{
    const g=GARDENS[m.garden]||['·','No goal set yet'];
    const acts=m.actions.length?'<div class="acts">'+m.actions.map(a=>'<span>'+esc(a)+'</span>').join('')+'</div>':'';
    return '<div class="row"><div class="g">'+g[0]+'</div><div class="body"><div class="name">'+esc(m.name)+'</div>'+
      '<div class="garden">'+(m.garden?g[1]:'<span class="muted">no goal picked yet</span>')+'</div>'+acts+
      '</div><div class="badge '+badge[m.status][0]+'">'+badge[m.status][1]+'</div></div>';
  }).join('');
  document.getElementById('list').innerHTML=html||'<div class="empty">No one matches that filter.</div>';
}
function stat(cls,n,label){ return '<div class="stat '+cls+'"><b>'+n+'</b><span>'+label+'</span></div>'; }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

document.getElementById('q').addEventListener('input',e=>{ query=e.target.value.toLowerCase().trim(); render(); });
document.getElementById('gardenChips').addEventListener('click',e=>{ const c=e.target.closest('.chip'); if(!c)return; gardenFilter=c.dataset.g; render(); });
document.getElementById('statusSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; statusFilter=b.dataset.s; [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b)); render(); });
document.getElementById('refresh').addEventListener('click',load);
load();
setInterval(load, 60000); // auto-refresh every minute
</script>
</body>
</html>
