<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Book Orders</title>
<style>
  :root { --navy:#0D2C4F; --gold:#F2D5A6; --line:#e2e8f0; --muted:#64748b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; background:#f5f5f7; color:#1a1a1a; }
  header { background:var(--navy); color:#fff; padding:18px 16px; position:sticky; top:0; z-index:5; }
  header h1 { margin:0; font-size:1.15rem; }
  header p { margin:4px 0 0; font-size:.8rem; opacity:.8; }
  .wrap { max-width:760px; margin:0 auto; padding:14px; }
  .search { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; font-size:1rem; margin-bottom:12px; }
  .msg { padding:10px 12px; border-radius:8px; font-size:.9rem; margin-bottom:12px; }
  .msg.ok { background:#dcfce7; color:#166534; }
  .msg.err { background:#fee2e2; color:#991b1b; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .card .name { font-weight:800; font-size:1rem; }
  .card .meta { font-size:.8rem; color:var(--muted); margin:3px 0 10px; }
  .card label { font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .card input.email { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:.95rem; margin:4px 0 10px; }
  .card button { width:100%; padding:12px; border:0; border-radius:100px; background:var(--navy); color:#fff; font-weight:800; font-size:.95rem; cursor:pointer; }
  .card button:disabled { opacity:.5; }
  .row-status { font-size:.82rem; margin-top:8px; text-align:center; }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }
</style>
</head>
<body>
<header>
  <h1>📖 Book Orders</h1>
  <p>Who paid (from Stripe). Fix a wrong email + resend the book.</p>
</header>
<div class="wrap">
  <input id="search" class="search" placeholder="Search name or email…" oninput="render()">
  <div id="msg"></div>
  <div id="list"><div class="empty">Loading…</div></div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const KEY = params.get('key') || '';
  let ORDERS = [];

  function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtDate(iso){ try { return new Date(iso).toLocaleString(); } catch { return iso; } }

  async function load() {
    if (!KEY) { document.getElementById('list').innerHTML = '<div class="empty">Add ?key=YOUR_ADMIN_KEY to the URL.</div>'; return; }
    try {
      const r = await fetch('/api/book-orders?key=' + encodeURIComponent(KEY));
      const d = await r.json();
      if (!r.ok) { document.getElementById('list').innerHTML = '<div class="empty">' + esc(d.error || 'Error') + '</div>'; return; }
      ORDERS = d.orders || [];
      render();
    } catch (e) {
      document.getElementById('list').innerHTML = '<div class="empty">Failed to load.</div>';
    }
  }

  function render() {
    const q = (document.getElementById('search').value || '').toLowerCase();
    const list = document.getElementById('list');
    const rows = ORDERS.filter(o =>
      !q || (o.name||'').toLowerCase().includes(q) || (o.email||'').toLowerCase().includes(q)
    );
    if (!rows.length) { list.innerHTML = '<div class="empty">No orders.</div>'; return; }
    list.innerHTML = rows.map(o => `
      <div class="card" data-id="${esc(o.id)}">
        <div class="name">${esc(o.name || '(no name)')}</div>
        <div class="meta">$${o.amount} · ${fmtDate(o.created)}</div>
        <label>Email (edit if they typed it wrong, then resend)</label>
        <input class="email" value="${esc(o.email || '')}" placeholder="correct@email.com">
        <button onclick="resend(this)">Resend the book</button>
        <div class="row-status"></div>
      </div>`).join('');
  }

  async function resend(btn) {
    const card = btn.closest('.card');
    const session_id = card.getAttribute('data-id');
    const email = card.querySelector('input.email').value.trim();
    const status = card.querySelector('.row-status');
    if (!email) { status.textContent = 'Enter an email first.'; status.style.color = '#991b1b'; return; }
    btn.disabled = true; status.textContent = 'Sending…'; status.style.color = '#64748b';
    try {
      const r = await fetch('/api/book-orders', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: KEY, session_id, email })
      });
      const d = await r.json();
      if (r.ok && d.success) { status.textContent = '✅ Sent to ' + d.sentTo; status.style.color = '#166534'; }
      else { status.textContent = '❌ ' + (d.error || 'Failed'); status.style.color = '#991b1b'; }
    } catch (e) {
      status.textContent = '❌ Network error';
      status.style.color = '#991b1b';
    }
    btn.disabled = false;
  }

  load();
</script>
</body>
</html>
