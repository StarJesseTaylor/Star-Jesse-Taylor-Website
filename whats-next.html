<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workshop and Cohort | Star Jesse Taylor</title>
  <meta name="description" content="Workshop and cohort coming up. Get on the list." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-T0T1Z0VBT8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-T0T1Z0VBT8');
  </script>
</head>
<body style="background:linear-gradient(160deg,#0a1929 0%,#0d2540 100%);color:#fff;min-height:100vh;">

<section style="padding:64px 0 40px;text-align:center;">
  <div style="max-width:560px;margin:0 auto;padding:0 24px;">
    <a href="index.html" style="display:inline-block;color:#7dd3fc;text-decoration:none;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;font-size:0.78rem;margin-bottom:32px;">Star Jesse Taylor</a>
    <h1 style="font-size:clamp(1.6rem,4vw,2.2rem);font-weight:800;line-height:1.25;margin:0 0 16px;color:#fff;">Workshop and cohort coming up.</h1>
    <p style="font-size:1.05rem;line-height:1.6;color:rgba(255,255,255,0.82);margin:0;">Get on the list. I'll send the dates when they're locked.</p>
  </div>
</section>

<section style="padding:20px 0 40px;">
  <div style="max-width:560px;margin:0 auto;padding:0 24px;">

    <div style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:14px;padding:22px 24px;margin-bottom:16px;">
      <div style="font-size:0.72rem;color:#f5d478;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:8px;">Online Workshop</div>
      <div style="color:#fff;font-size:1.05rem;line-height:1.5;">Coming August 2026.</div>
    </div>

    <div style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:14px;padding:22px 24px;">
      <div style="font-size:0.72rem;color:#7dd3fc;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:8px;">6-Week Cohort</div>
      <div style="color:#fff;font-size:1.05rem;line-height:1.5;">Six weeks of live group coaching. $2,200. Online workshop included.</div>
    </div>

  </div>
</section>

<section style="padding:20px 0 60px;">
  <div style="max-width:480px;margin:0 auto;padding:0 24px;">
    <form id="whatsNextForm" style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);border-radius:14px;padding:28px;">

      <input type="text" name="website_url" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px;" />

      <input type="text" name="firstName" placeholder="First name" required style="width:100%;padding:14px 16px;border-radius:10px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.95);color:#1a1a1a;font-size:1rem;margin-bottom:12px;box-sizing:border-box;" />

      <input type="email" name="email" placeholder="Email" required style="width:100%;padding:14px 16px;border-radius:10px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.95);color:#1a1a1a;font-size:1rem;margin-bottom:20px;box-sizing:border-box;" />

      <p style="color:#fff;font-size:0.9rem;font-weight:600;margin:0 0 12px;">Send me info on:</p>

      <label style="display:flex;align-items:center;gap:12px;padding:11px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.18);border-radius:10px;margin-bottom:8px;cursor:pointer;color:#fff;font-size:0.95rem;">
        <input type="checkbox" name="interest_workshop" value="1" style="width:18px;height:18px;cursor:pointer;flex-shrink:0;" />
        <span>Online Workshop</span>
      </label>

      <label style="display:flex;align-items:center;gap:12px;padding:11px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.18);border-radius:10px;margin-bottom:8px;cursor:pointer;color:#fff;font-size:0.95rem;">
        <input type="checkbox" name="interest_cohort" value="1" style="width:18px;height:18px;cursor:pointer;flex-shrink:0;" />
        <span>6-Week Cohort</span>
      </label>

      <label style="display:flex;align-items:center;gap:12px;padding:11px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.18);border-radius:10px;margin-bottom:20px;cursor:pointer;color:#fff;font-size:0.95rem;">
        <input type="checkbox" name="interest_both" value="1" style="width:18px;height:18px;cursor:pointer;flex-shrink:0;" />
        <span>Both</span>
      </label>

      <button type="submit" style="width:100%;padding:15px 20px;border-radius:10px;border:none;background:#f5d478;color:#0a1929;font-size:1rem;font-weight:800;cursor:pointer;">Get on the list</button>

      <p id="whatsNextStatus" style="text-align:center;margin-top:14px;font-size:0.85rem;color:rgba(255,255,255,0.7);min-height:20px;"></p>
    </form>
  </div>
</section>

<script>
(function() {
  const form = document.getElementById('whatsNextForm');
  if (!form) return;
  const status = document.getElementById('whatsNextStatus');

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    const fd = new FormData(form);

    const workshop = !!fd.get('interest_workshop');
    const cohort = !!fd.get('interest_cohort');
    const both = !!fd.get('interest_both');

    if (!workshop && !cohort && !both) {
      status.textContent = 'Pick at least one.';
      return;
    }

    const data = {
      firstName: fd.get('firstName') || '',
      email: fd.get('email') || '',
      interest_workshop: workshop || both,
      interest_cohort: cohort || both,
      website_url: fd.get('website_url') || '',
      source: 'whats-next'
    };

    const btn = form.querySelector('button[type="submit"]');
    const orig = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Adding you...';
    status.textContent = '';

    try {
      const res = await fetch('/api/whats-next', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const json = await res.json().catch(() => ({}));
      if (res.ok && json.success) {
        form.innerHTML = '<div style="text-align:center;padding:24px 0;"><div style="font-size:2.4rem;margin-bottom:12px;">✓</div><div style="color:#fff;font-size:1.15rem;font-weight:700;margin-bottom:8px;">You\'re on the list.</div><div style="color:rgba(255,255,255,0.78);font-size:0.95rem;">I\'ll send the dates when they\'re locked.</div></div>';
      } else {
        status.textContent = json.error || 'Something went wrong. Try again.';
        btn.disabled = false;
        btn.textContent = orig;
      }
    } catch (err) {
      status.textContent = 'Connection issue. Try again.';
      btn.disabled = false;
      btn.textContent = orig;
    }
  });
})();
</script>

</body>
</html>
